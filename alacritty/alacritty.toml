[env]
TERM = "xterm-256color"

[font]
size = 12.0
builtin_box_drawing = true

[font.normal]
family = "Caskaydia Mono Nerd Font"
style = "Regular"

[font.bold]
family = "Caskaydia Mono Nerd Font"
style = "Bold"

[font.italic]
family = "Caskaydia Mono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Caskaydia Mono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 2

[font.glyph_offset]
x = 0
y = 0


[general]
import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]

[terminal.shell]
program = "/usr/bin/zsh"
args = ["--login"]
