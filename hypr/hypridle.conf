general {
  # if hyprlock isn’t already running, start it when locking
  lock_cmd           = pidof hyprlock || hyprlock
  # right before suspend: lock the session
  before_sleep_cmd   = loginctl lock-session
  # on resume: turn DPMS back on
  after_sleep_cmd    = hyprctl dispatch dpms on
}

listener {
  # after 5 min, dim screen to 10%
  timeout            = 300
  on-timeout         = brightnessctl set 10%
  # on resume, restore brightness to full (optional)
  on-resume          = brightnessctl set 100%
}

listener {
  # after 5½ min, lock session
  timeout            = 330
  on-timeout         = loginctl lock-session
}

listener {
  # after ~5.8 min, switch off display
  timeout            = 350
  on-timeout         = hyprctl dispatch dpms off
  on-resume          = hyprctl dispatch dpms on
}

# If you ever want auto-suspend after longer idle:
# listener {
#   timeout          = 1800
#   on-timeout       = systemctl suspend
# }
